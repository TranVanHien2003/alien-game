name: Test, Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Đọc phiên bản Godot
        run: echo "GODOT_VERSION=$(cat .godot-version)" >> "$GITHUB_ENV"

      - name: Cache Godot + templates
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Cài Godot + export templates
        run: bash tools/setup.sh --templates

      - name: Test (nội dung, save, gameplay)
        run: make test

      - name: Export Web
        run: make export-web

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
